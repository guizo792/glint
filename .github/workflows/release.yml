name: Release

on:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - name: Build installer
        run: npx --prefix ui tauri build
        working-directory: app
      # Code signing goes here once a certificate exists. Unsigned installers trigger
      # a SmartScreen warning.
      - name: Draft a release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes target/release/bundle/nsis/*.exe
