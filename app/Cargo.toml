[package]
name = "glint"
version = "0.1.0"
edition = "2021"
description = "A fast keyboard launcher for Windows"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glint-core = { path = "../crates/glint-core" }
glint-win = { path = "../crates/glint-win" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
