<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#1e1f22;color:#eee;font:18px Segoe UI,system-ui;height:100%}
  input{box-sizing:border-box;width:100%;padding:18px 20px;font:inherit;background:transparent;color:inherit;border:0;outline:0}
  #s{padding:6px 20px;color:#888;font-size:12px}
</style>
<input id="q" placeholder="Search…" autofocus>
<div id="s">idle</div>
<script>
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const q = document.getElementById('q'), s = document.getElementById('s');
  listen('shown', (e) => {
    const t0us = e.payload;
    q.value = ''; q.focus();
    requestAnimationFrame(() => {
      const nowMs = performance.timeOrigin + performance.now();
      const ms = nowMs - t0us / 1000;
      const focused = document.hasFocus() && document.activeElement === q;
      s.textContent = `shown in ${ms.toFixed(1)} ms, focused=${focused}`;
      invoke('report', { ms, focused });
    });
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('hide'); });
  addEventListener('blur', () => invoke('hide'));
</script>
