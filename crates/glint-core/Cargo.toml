[package]
name = "glint-core"
version = "0.0.0"
edition = "2021"

[dependencies]
nucleo-matcher = "0.3"
memchr = "2"
rayon = "1"
memmap2 = "0.9"
bytemuck = "1"
jwalk = "0.8"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }
